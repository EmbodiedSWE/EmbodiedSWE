[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosigen"
version = "0.1.0"
description = ""
# Assets are fetched from Hugging Face and materialized under a process-safe file lock.
dependencies = ["huggingface_hub>=0.23", "filelock>=3.12"]

# robobench/ — the relocatable benchmark ENV suite (the focus): core + robots + suites/<flavor>.
[tool.setuptools.packages.find]
include = ["robobench*"]

# Binary assets are fetched from HF. Include the manifest and source text dependencies in wheels.
[tool.setuptools.package-data]
"robobench" = ["assets_manifest.json", "**/assets/**/*.usda", "**/assets/**/*.mdl", "**/assets/**/*.urdf", "**/assets/**/*.xml", "**/assets/**/*.json", "**/assets/**/*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.usd", "*.usdc", "*.png", "*.jpg", "*.jpeg", "*.pt", "*.mp4", "*.hdr", "*.exr", "assets/rooms/**/*"]

[tool.pyright]
reportPrivateUsage = "none"
reportUnusedVariable = "none"
