[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosigen"
version = "0.1.0"
description = ""

# robobench/ — the relocatable benchmark ENV suite (the focus): core + robots + suites/<flavor>.
[tool.setuptools.packages.find]
include = ["robobench*"]

# Curated USD assets shipped with suites (editable installs work without this; wheels need it).
[tool.setuptools.package-data]
"robobench.suites.deformable" = [
    "assets/**/*.usd",
    "assets/**/*.usda",
    "assets/**/*.usdc",
    "assets/**/*.png",
    "assets/**/*.jpg",
    "assets/**/*.json",
]
"robobench.suites.packing" = [
    "assets/**/*.usd",
    "assets/**/*.usdc",
    "assets/**/*.png",
    "assets/**/*.jpg",
    "assets/**/*.md",
]
"robobench.suites.puzzle" = ["assets/**/*.usd", "assets/**/*.usda", "assets/**/*.usdc", "assets/**/*.png", "assets/**/*.jpg", "assets/**/*.json", "assets/**/*.md"]

[tool.pyright]
reportPrivateUsage = "none"
reportUnusedVariable = "none"
