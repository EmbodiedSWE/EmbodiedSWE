[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosigen"
version = "0.1.0"
description = ""

# robobench/ — the relocatable benchmark ENV suite (the focus): core + robots + suites/<flavor>.
[tool.setuptools.packages.find]
include = ["robobench*"]

# Curated USD assets shipped with suites (editable installs work without this; wheels need it).
[tool.setuptools.package-data]
"robobench.suites.folding" = ["assets/**/*.usd"]
"robobench.suites.pouring" = ["assets/**/*.usd", "assets/**/*.png", "assets/**/*.json"]

[tool.pyright]
reportPrivateUsage = "none"
reportUnusedVariable = "none"
