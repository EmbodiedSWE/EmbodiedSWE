[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosigen"
version = "0.1.0"
description = ""

# robobench/ — the relocatable benchmark ENV suite (the focus): core + robots + suites/<flavor>.
[tool.setuptools.packages.find]
include = ["robobench*"]

# (No package-data yet:  add a package-data entry once a suite  brings curated USD assets into robobench/suites/<flavor>/assets/.)

[tool.pyright]
reportPrivateUsage = "none"
reportUnusedVariable = "none"
