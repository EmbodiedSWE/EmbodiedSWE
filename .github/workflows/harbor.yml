name: Harbor adapter

on:
  pull_request:
    paths:
      - "eval/**"
      - "robobench/**"
      - "tests/**"
      - ".github/workflows/harbor.yml"
  push:
    paths:
      - "eval/**"
      - "robobench/**"
      - "tests/**"
      - ".github/workflows/harbor.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/harbor_support/requirements.txt
      - run: python -m pip install -r eval/harbor_support/requirements.txt pytest numpy huggingface_hub filelock
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: docker compose version
      - run: python -m pytest tests -q
