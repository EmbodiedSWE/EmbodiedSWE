# Pen holder (RoboDojo fill-pen-holder port), Franka, OSC preset: pens lying loose -> into the cup,
# cup standing on the surface. Friction grasp, rigid bodies, dt 1/120. A `ppo:` block here overrides base.yaml.
task:
  name: pen_holder_franka_osc
  preset: packing.pen_holder.franka.osc
  episode_seconds: 90
  num_envs: 1024
  # rl/scripts/smoke.py, RTX 5090, 2026-09-05: 256 envs -> 4,622 env-steps/s (18 batched steps/s,
  # 4.4 GB) — no SDF meshes, so ~4x cheaper per step than the threading scenes.
  throughput_note: "256 envs -> 4.6k env-steps/s, 4.4 GB; 1024 not yet measured"
action:
  affine:
    - dims: [6, 7]
      lo: 0.0
      hi: 0.04
