# Reward: privileged rubric progress (the standard RL condition). The coding agent never sees
# the grader; disclose this wherever the arm is reported.
reward:
  mode: progress
  form: delta
  progress_scale: 1.0
  success_bonus: 1.0
  action_penalty: 0.0         # action-rate penalty weight (|a_t - a_{t-1}|^2); off
