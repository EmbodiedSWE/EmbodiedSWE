# Egress allowlist for the agent network.
# Allowed: the Anthropic API (the agent's brain) and PyPI (helper libs are
# legitimate solving; D5 in README). Everything else — GitHub above all, since
# the public repo history cites solve-calibrated configs — is denied.
acl allowed_dst dstdomain api.anthropic.com
acl allowed_dst dstdomain .pypi.org
acl allowed_dst dstdomain files.pythonhosted.org
acl allowed_dst dstdomain pypi.nvidia.com

acl CONNECT_method method CONNECT
http_access allow allowed_dst
http_access deny all

# No caching of API traffic
cache deny all
http_port 3128
