# Diversify session condition: phase level, default.

scene: scene_0        # context: the scene this session works against
strategy: strategy_0  # context: the strategy whose solve gets phase-divided
level: phase
prompts:            # agent/prompts/<path>.md, assembled in order after _contract.md
  - levels/phase
cli:                # agent/cli/<name>.py the session is offered
  - create_cell
  - generate
model: claude-opus-5
image: rb-l1-agent:2.1.216
gpu: "0"
budget_min: 240   # wall-clock cap for the session
