# Diversify session condition: phase level, default.
# Case modules (e.g. a failure-mining prompt) become extra entries in `prompts:`
# of a sibling condition yaml — never conditional prose inside a template.

scene: scene_0        # context: the scene this session works against
strategy: strategy_0  # context: the strategy (used by phase level)
level: phase
prompts:
  - phase
cli:
  - create_cell
  - generate
model: claude-opus-5
image: rb-l1-agent:2.1.216
gpu: "0"
