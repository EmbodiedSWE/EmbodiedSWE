# Diversify session condition: scene level, default.
# One yaml = one condition; the launcher copies it into the session ledger.

scene: scene_0        # context: the scene this session works against
strategy: strategy_0  # context: the strategy (used by phase level)
level: scene
prompts:            # agent/prompts/<path>.md, assembled in order after _contract.md
  - levels/scene
  - rules/autonomous_operation
cli:              # agent/cli/<name>.py the session is offered (declaration:
  - create_cell     # the write-fence is the mounts; this shapes the prompt)
  - generate
image: rb-diversify:2.1.216
gpu: "0"
